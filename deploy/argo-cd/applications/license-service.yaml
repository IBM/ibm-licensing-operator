apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ibm-license-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  sources:
    - repoURL: "https://github.com/IBM/ibm-licensing-operator"
      targetRevision: "latest-4.x"
      path: deploy/argo-cd/components/license-service/helm-cluster-scoped
      helm:
        valuesObject: {}
    - repoURL: "https://github.com/IBM/ibm-licensing-operator"
      targetRevision: "latest-4.x"
      path: deploy/argo-cd/components/license-service/helm
      helm:
        valuesObject: {}
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: ibmlicensingdefinitions.operator.ibm.com
      managedFieldsManagers:
        - helm
      jsonPointers:
        - /metadata/labels/component-id
        - /metadata/annotations/argocd.argoproj.io~1sync-wave
        - /metadata/labels/app.kubernetes.io/managed-by
        - /metadata/annotations/meta.helm.sh/release-namespace
        - /metadata/annotations/meta.helm.sh/release-name
