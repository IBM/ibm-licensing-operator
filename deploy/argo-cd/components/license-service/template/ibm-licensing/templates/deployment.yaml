---
# Source: ibm-licensing/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    productID: 068a62892a1e4db39641342e592daa25
    productMetric: FREE
    productName: IBM Cloud Platform Common Services
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    component-id: ibm-licensing
  name: ibm-licensing-operator
  namespace: ibm-licensing
spec:
  replicas: 1
  selector:
    matchLabels:
      name: ibm-licensing-operator
  template:
    metadata:
      annotations:
        productID: 068a62892a1e4db39641342e592daa25
        productMetric: FREE
        productName: IBM Cloud Platform Common Services
      labels:
        app.kubernetes.io/instance: ibm-licensing-operator
        app.kubernetes.io/managed-by: ibm-licensing-operator
        app.kubernetes.io/name: ibm-licensing
        name: ibm-licensing-operator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - ppc64le
                - s390x
      containers:
        - command:
            - ibm-licensing-operator
          env:
            - name: IBM_LICENSING_IMAGE
              value: icr.io/cpopen/cpfs/ibm-licensing:4.2.26
            - name: WATCH_NAMESPACE
              value: "ibm-licensing"
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: ibm-licensing-operator
            - name: SA_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: CRD_RECONCILE_INTERVAL
              value: "300"
          image: icr.io/cpopen/ibm-licensing-operator:4.2.26
          imagePullPolicy: IfNotPresent
          name: ibm-licensing-operator
          resources:
            limits:
              cpu: 20m
              ephemeral-storage: 500Mi
              memory: 150Mi
            requests:
              cpu: 10m
              ephemeral-storage: 250Mi
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      serviceAccountName: ibm-licensing-operator
      
      imagePullSecrets:
        - name: ibm-entitlement-key
