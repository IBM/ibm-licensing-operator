{{- if .Values.ibmLicensing.createRBAC }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    component-id: {{ .Chart.Name }}
  name: {{ if not ((.Values.ibmLicensing.spec).features).nssEnabled }}{{ ((.Values.ibmLicensing.operand).serviceAccount).name | default "ibm-license-service" }}{{ else }}ibm-license-service{{ end }}
  namespace: {{ .Values.ibmLicensing.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    component-id: {{ .Chart.Name }}
  name: {{ if ((.Values.ibmLicensing.spec).features).nssEnabled }}{{ ((.Values.ibmLicensing.operand).serviceAccount).name | default "ibm-license-service-restricted" }}{{ else }}ibm-license-service-restricted{{ end }}
  namespace: {{ .Values.ibmLicensing.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    component-id: {{ .Chart.Name }}
  name: ibm-licensing-default-reader
  namespace: {{ .Values.ibmLicensing.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    component-id: {{ .Chart.Name }}
  name: {{ .Values.ibmLicensing.operator.serviceAccount.name | default "ibm-licensing-operator" }}
  namespace: {{ .Values.ibmLicensing.namespace }}
{{- end }}
