---
apiVersion: operator.ibm.com/v1alpha1
kind: IBMLicensing
metadata:
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    component-id: {{ .Chart.Name }}
  name: instance
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  {{- $imagePullData := dict -}}

  {{- /* Set license */ -}}
  {{- $_ := set $imagePullData "license" (dict "accept" .Values.global.licenseAccept) -}}

  {{- /* If imagePullSecret is declared, append it to the list of secrets specified in IBMLicensing CR's spec (or create a new list if empty) */ -}}
  {{- if .Values.global.imagePullSecret -}}
    {{- $_ := set $imagePullData "imagePullSecrets" (prepend (default list .Values.ibmLicensing.spec.imagePullSecrets) .Values.global.imagePullSecret | uniq) -}}
  {{- end -}}

  {{- /* Propagate top-level excludeNamespace into spec.features.excludeNamespace */ -}}
  {{- if .Values.ibmLicensing.excludeNamespace -}}
    {{- $_ := set $imagePullData "features" (mergeOverwrite (default dict ((.Values.ibmLicensing.spec).features)) (dict "excludeNamespace" .Values.ibmLicensing.excludeNamespace)) -}}
  {{- end -}}

  {{- /* Inject operand identity and scheduling from ibmLicensing.operand.* into spec.operand */ -}}
  {{- $operandConfig := dict -}}
  {{- with ((.Values.ibmLicensing.operand).serviceAccount).name -}}{{- $_ := set $operandConfig "serviceAccountName" . -}}{{- end -}}
  {{- with .Values.ibmLicensing.operand.nodeSelector -}}{{- $_ := set $operandConfig "nodeSelector" . -}}{{- end -}}
  {{- with .Values.ibmLicensing.operand.affinity -}}{{- $_ := set $operandConfig "affinity" . -}}{{- end -}}
  {{- with .Values.ibmLicensing.operand.podAnnotations -}}{{- $_ := set $operandConfig "podAnnotations" . -}}{{- end -}}
  {{- with .Values.ibmLicensing.operand.podLabels -}}{{- $_ := set $operandConfig "podLabels" . -}}{{- end -}}
  {{- if $operandConfig -}}
    {{- $_ := set $imagePullData "operand" $operandConfig -}}
  {{- end -}}

  {{- toYaml (mergeOverwrite .Values.ibmLicensing.spec $imagePullData) | nindent 2 }}
