---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    productID: 068a62892a1e4db39641342e592daa25
    productMetric: FREE
    productName: IBM Cloud Platform Common Services
    {{- if ((.Values.ibmLicensing.operator).annotations) }}
      {{- toYaml .Values.ibmLicensing.operator.annotations | nindent 4 -}}
    {{ end }}
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/instance: ibm-licensing-operator
    app.kubernetes.io/managed-by: ibm-licensing-operator
    app.kubernetes.io/name: ibm-licensing
    {{- if ((.Values.ibmLicensing.operator).labels) }}
      {{- toYaml .Values.ibmLicensing.operator.labels | nindent 4 -}}
    {{ end }}
    component-id: {{ .Chart.Name }}
  name: ibm-licensing-operator
  namespace: {{ .Values.ibmLicensing.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: ibm-licensing-operator
  template:
    metadata:
      annotations:
        {{- $ibmAnnotations := dict
          "productID" "068a62892a1e4db39641342e592daa25"
          "productMetric" "FREE"
          "productName" "IBM Cloud Platform Common Services"
        }}
        {{- $legacyAnnotations := ((.Values.ibmLicensing.operator).annotations) | default dict }}
        {{- toYaml (merge $ibmAnnotations .Values.ibmLicensing.podAnnotations $legacyAnnotations) | nindent 8 }}
      labels:
        {{- $ibmLabels := dict
          "app.kubernetes.io/instance" "ibm-licensing-operator"
          "app.kubernetes.io/managed-by" "ibm-licensing-operator"
          "app.kubernetes.io/name" "ibm-licensing"
          "name" "ibm-licensing-operator"
        }}
        {{- $legacyLabels := ((.Values.ibmLicensing.operator).labels) | default dict }}
        {{- toYaml (merge $ibmLabels .Values.ibmLicensing.podLabels $legacyLabels) | nindent 8 }}
    spec:
      {{- $ibmAffinity := dict "nodeAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (dict "nodeSelectorTerms" (list (dict "matchExpressions" (list (dict "key" "kubernetes.io/arch" "operator" "In" "values" (list "amd64" "ppc64le" "s390x"))))))) }}
      affinity:
        {{- toYaml (merge $ibmAffinity .Values.ibmLicensing.affinity) | nindent 8 }}
      containers:
        - command:
            - ibm-licensing-operator
          env:
            - name: IBM_LICENSING_IMAGE
              value: {{ .Values.global.imagePullPrefix }}/{{ .Values.ibmLicensing.imageRegistryNamespaceOperand }}/ibm-licensing:4.2.25
            - name: WATCH_NAMESPACE
              value: {{ .Values.ibmLicensing.watchNamespace | quote }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: ibm-licensing-operator
            - name: SA_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: CRD_RECONCILE_INTERVAL
              value: "300"
          image: {{ .Values.global.imagePullPrefix }}/{{ .Values.ibmLicensing.imageRegistryNamespaceOperator }}/ibm-licensing-operator:4.2.25
          imagePullPolicy: IfNotPresent
          name: ibm-licensing-operator
          resources:
            limits:
              cpu: 20m
              ephemeral-storage: 500Mi
              memory: 150Mi
            requests:
              cpu: 10m
              ephemeral-storage: 250Mi
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      serviceAccountName: {{ .Values.ibmLicensing.serviceAccount.name | default "ibm-licensing-operator" }}
      {{- if .Values.ibmLicensing.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.ibmLicensing.nodeSelector | nindent 8 }}
      {{- end }}
      {{ if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end -}}
