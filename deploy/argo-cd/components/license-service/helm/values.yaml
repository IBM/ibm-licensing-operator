global:
  imagePullPrefix: icr.io
  imagePullSecret: ibm-entitlement-key
  licenseAccept: true

ibmLicensing:
  namespace: ibm-licensing
  watchNamespace: ibm-licensing
  # Comma-separated list of namespaces to exclude from license collection.
  excludeNamespace: ""
  imageRegistryNamespaceOperator: cpopen
  imageRegistryNamespaceOperand: cpopen/cpfs
  createRBAC: true
  createRBACInWatchedNamespaces: true
  spec:
    version: 4.2.25
    datasource: datacollector
    httpsEnable: true
    enableInstanaMetricCollection: false
    features:
      nssEnabled: false
      nodeCpuCappingEnabled: true
      kubeRBACAuthEnabled: true
      operandRequestsEnabled: true
      customResourcesEnabled: true
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi
        ephemeral-storage: 256Mi
