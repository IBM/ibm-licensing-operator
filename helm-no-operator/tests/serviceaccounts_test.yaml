---

suite: ILS no-operator ServiceAccounts customization tests

templates:
  - templates/serviceaccounts.yaml

release:
  namespace: test-ns

set:
  ibmLicensing.namespace: test-ns
  ibmLicensing.createRBAC: true

tests:
  # --- operand ServiceAccount (nssEnabled: false) ---

  - it: operand ServiceAccount uses default ibm-license-service name when nssEnabled is false
    asserts:
      - equal:
          path: metadata.name
          value: ibm-license-service
        documentIndex: 0

  - it: operand ServiceAccount uses overridden name when nssEnabled is false
    set:
      ibmLicensing.operand.serviceAccount.name: my-operand-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-operand-sa
        documentIndex: 0

  - it: restricted ServiceAccount keeps ibm-license-service-restricted when nssEnabled is false
    asserts:
      - equal:
          path: metadata.name
          value: ibm-license-service-restricted
        documentIndex: 1

  # --- operand ServiceAccount (nssEnabled: true) ---

  - it: restricted ServiceAccount uses default name when nssEnabled is true
    set:
      ibmLicensing.spec.features.nssEnabled: true
    asserts:
      - equal:
          path: metadata.name
          value: ibm-license-service-restricted
        documentIndex: 1

  - it: restricted ServiceAccount uses overridden name when nssEnabled is true
    set:
      ibmLicensing.spec.features.nssEnabled: true
      ibmLicensing.operand.serviceAccount.name: my-restricted-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-restricted-sa
        documentIndex: 1

  - it: non-restricted ServiceAccount keeps ibm-license-service when nssEnabled is true
    set:
      ibmLicensing.spec.features.nssEnabled: true
      ibmLicensing.operand.serviceAccount.name: my-restricted-sa
    asserts:
      - equal:
          path: metadata.name
          value: ibm-license-service
        documentIndex: 0

  # --- no ServiceAccounts when createRBAC is false ---

  - it: renders no ServiceAccounts when createRBAC is false
    set:
      ibmLicensing.createRBAC: false
    asserts:
      - hasDocuments:
          count: 0
